---
Name: MSSQL Server Credential Type
Description: MSSQL Server Credential Type
Author: UpGuard Research Team
References:
  - https://docs.microsoft.com/en-us/sql/odbc/reference/develop-app/using-odbc-data-source-names-dsns?view=sql-server-ver15#dsn-connection-string

# Input Configuration
fields:
  - id: db_hostname
    type: string
    label: Database Host
  - id: db_user
    type: string
    label: Username
  - id: db_password
    type: string
    label: Password
    secret: true
  - id: db_name
    type: string
    label: Database Name (Optional)
required:
  - db_hostname
  - db_user
  - db_password
  - db_name

# Injector configuration
extra_vars:
  db_mssql_user: '{{ db_user }}'
  db_mssql_dbname: '{{ db_name }}'
  db_mssql_hostname: '{{ db_hostname }}'
  db_mssql_password: '{{ db_password }}'